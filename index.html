<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KotoLang</title>
<style>
:root{--bg:#fbfbfd;--fg:#1d1d20;--muted:#5c5c66;--accent:#3a6ea5;--line:#e3e3ea;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141417;--fg:#ececf0;--muted:#a0a0ac;--accent:#8ab4e8;--line:#2c2c33;--card:#1c1c21}}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 72px;background:var(--bg);color:var(--fg);line-height:1.85;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:0 auto}
header{padding:48px 0 8px}
header a{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:26px;margin:16px 0 4px}
h2{font-size:20px;margin:40px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:28px 0 8px}
p,li{color:var(--fg)}
ul{padding-left:1.25em}
hr{border:0;border-top:1px solid var(--line);margin:40px 0}
a{color:var(--accent)}
code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.92em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px 20px;margin:20px 0}
footer{margin-top:56px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header></header>

<h1>KotoLang</h1>
<p>Your world. Your English. — 教材をあなた自身の AI でつくる、英語リスニングアプリ。</p>
<div class="card">
<h3>ページ</h3>
<ul>
<li><a href="support.html">サポート・よくある質問</a></li>
<li><a href="privacy.html">プライバシーポリシー / Privacy Policy</a></li>
<li><a href="terms.html">利用規約 / Terms</a></li>
</ul>
</div>

<footer>KotoLang</footer>
</div>
</body>
</html>
